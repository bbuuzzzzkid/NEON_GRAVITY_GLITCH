<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Gravity Glitch</title>

<style>
:root{
    --bg:#050508;
    --cyan:#00ffff;
    --orange:#ff8800;
    --pink:#ff00aa;
    --green:#00ff66;
    --red:#ff3333;
    --white:#e8faff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg);
    color:var(--white);
    font-family:Consolas,Monaco,monospace;
}

body{
    position:relative;
}

/* =========================
   GAME CANVAS
========================= */

#gameCanvas{
    display:block;
    width:100vw;
    height:100vh;
    background:var(--bg);
}

/* =========================
   HUD
========================= */

#hud{
    position:absolute;
    top:0;
    left:0;

    width:100%;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:16px 24px;

    z-index:100;

    pointer-events:none;
}

.hud-group{
    display:flex;
    gap:24px;
    align-items:center;
}

.hud-item{
    font-size:18px;
    letter-spacing:1px;
    text-shadow:
        0 0 5px currentColor,
        0 0 10px currentColor,
        0 0 20px currentColor;
}

#level{
    color:var(--cyan);
}

#score{
    color:var(--green);
}

#timer{
    color:var(--orange);
}

#gravity{
    color:var(--pink);
}

/* =========================
   COMBO DISPLAY
========================= */

#combo{
    position:absolute;

    bottom:25px;
    left:50%;

    transform:translateX(-50%);

    font-size:28px;
    font-weight:bold;

    color:var(--orange);

    text-shadow:
        0 0 8px var(--orange),
        0 0 16px var(--orange),
        0 0 32px var(--orange);

    pointer-events:none;

    z-index:120;
}

/* =========================
   POWERUPS
========================= */

#powerups{
    position:absolute;

    right:20px;
    bottom:20px;

    display:flex;
    gap:10px;

    z-index:120;
}

.powerup-icon{
    width:40px;
    height:40px;

    border:2px solid white;
    border-radius:8px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:20px;

    background:rgba(255,255,255,.05);

    box-shadow:
        0 0 10px currentColor,
        0 0 20px currentColor;
}

/* =========================
   GRAVITY ALERT
========================= */

#gravityAlert{
    position:absolute;

    top:90px;
    left:50%;

    transform:translateX(-50%);

    color:var(--red);

    font-size:36px;
    font-weight:bold;

    display:none;

    z-index:150;

    animation:blink .45s infinite;

    text-shadow:
        0 0 10px var(--red),
        0 0 20px var(--red),
        0 0 40px var(--red);
}

@keyframes blink{
    50%{
        opacity:0;
    }
}

/* =========================
   BOSS UI
========================= */

#bossUI{
    position:absolute;

    top:65px;
    left:50%;

    transform:translateX(-50%);

    width:min(700px,80vw);

    display:none;

    z-index:120;
}

#bossName{
    text-align:center;
    margin-bottom:8px;

    color:var(--orange);

    font-size:20px;

    text-shadow:
        0 0 10px var(--orange),
        0 0 20px var(--orange);
}

#bossBar{
    height:24px;

    border:2px solid var(--orange);

    background:#111;

    overflow:hidden;

    box-shadow:
        0 0 12px var(--orange);
}

#bossHealth{
    width:100%;
    height:100%;

    background:var(--orange);

    transition:width .2s linear;
}

/* =========================
   OVERLAYS
========================= */

.overlay{
    position:absolute;
    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    background:rgba(0,0,0,.82);

    z-index:500;

    text-align:center;
}

.overlay.show{
    display:flex;
}

.overlay h1{
    font-size:64px;
    margin-bottom:15px;
}

.overlay h2{
    font-size:32px;
    margin-bottom:10px;
}

.overlay p{
    font-size:20px;
    margin-top:15px;
}

/* =========================
   GAME OVER
========================= */

#gameOver h1{
    color:var(--red);

    text-shadow:
        0 0 10px var(--red),
        0 0 20px var(--red),
        0 0 40px var(--red);
}

/* =========================
   VICTORY
========================= */

#victory h1{
    color:var(--green);

    text-shadow:
        0 0 10px var(--green),
        0 0 20px var(--green),
        0 0 40px var(--green);
}

#finalStats{
    margin-top:20px;
    line-height:2;

    font-size:24px;
}

#rank{
    margin-top:25px;

    font-size:40px;
    font-weight:bold;

    color:gold;

    text-shadow:
        0 0 15px gold,
        0 0 30px gold;
}

/* =========================
   LEVEL COMPLETE
========================= */

#levelComplete h1{
    color:var(--cyan);

    text-shadow:
        0 0 10px var(--cyan),
        0 0 20px var(--cyan);
}

#levelStats{
    margin-top:20px;
    line-height:2;
    font-size:22px;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width:900px){

    .hud-item{
        font-size:14px;
    }

    #gravityAlert{
        font-size:24px;
    }

    .overlay h1{
        font-size:42px;
    }

    #finalStats{
        font-size:18px;
    }
}
</style>
</head>
<body>

<!-- HUD -->

<div id="hud">

    <div class="hud-group">
        <div id="level" class="hud-item">LEVEL 1</div>
        <div id="score" class="hud-item">SCORE: 0</div>
    </div>

    <div class="hud-group">
        <div id="timer" class="hud-item">TIME: 0.0</div>
        <div id="gravity" class="hud-item">GRAVITY: NORMAL</div>
    </div>

</div>

<!-- Gravity Warning -->

<div id="gravityAlert">
    GRAVITY: INVERTED
</div>

<!-- Boss Health -->

<div id="bossUI">

    <div id="bossName">
        NEON SENTINEL
    </div>

    <div id="bossBar">
        <div id="bossHealth"></div>
    </div>

</div>

<!-- Combo Counter -->

<div id="combo"></div>

<!-- Powerups -->

<div id="powerups"></div>

<!-- Canvas -->

<canvas id="gameCanvas"></canvas>

<!-- Level Complete -->

<div id="levelComplete" class="overlay">

    <h1>LEVEL COMPLETE</h1>

    <div id="levelStats"></div>

</div>

<!-- Game Over -->

<div id="gameOver" class="overlay">

    <h1>SYSTEM CRASH</h1>

    <h2>GAME OVER</h2>

    <p>PRESS R TO REBOOT</p>

</div>

<!-- Victory -->

<div id="victory" class="overlay">

    <h1>MAINFRAME HACKED</h1>

    <div id="finalStats">

        <div id="finalScore">
            SCORE: 0
        </div>

        <div id="finalTime">
            TIME: 0.0 SECONDS
        </div>

        <div id="secretFound">
            SECRET BONUSES FOUND: 0
        </div>

    </div>

    <div id="rank">
        RANK: D
    </div>

    <p>PRESS R TO REBOOT</p>

</div>

<script src="game.js"></script>

</body>
</html>
